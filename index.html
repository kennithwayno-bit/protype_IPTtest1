<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TriviaCraft · Interactive Mobile UI Prototype</title>

  <!-- Load Tailwind CSS for layout utilities -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Load Google Fonts: 'Press Start 2P' for pixel headings/buttons & 'VT323' for retro pixel terminal text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ==========================================================================
       TRIVIACRAFT PIXEL DESIGN SYSTEM TOKENS & BASE STYLES
       ========================================================================== */
    :root {
      --bg-studio: #111116;
      --bg-screen: #1A1B24;
      --bg-card: #232532;
      --bg-input: #13141B;
      --border-dark: #0b0c10;

      /* Palette Colors */
      --pixel-green: #62A83B;
      --pixel-green-btn: #4E9A2D;
      --pixel-green-hi: #76CC4E;
      --pixel-green-lo: #356E1D;

      --pixel-yellow: #F2C438;
      --pixel-yellow-hi: #FFE27A;
      --pixel-yellow-lo: #B58616;

      --pixel-gray-btn: #6E717C;
      --pixel-gray-hi: #9094A1;
      --pixel-gray-lo: #474A52;

      --pixel-red-btn: #C93B2B;
      --pixel-red-hi: #E85C4C;
      --pixel-red-lo: #872116;

      --text-muted: #9A9EAE;
      --text-subtle: #6E7282;
    }

    /* Nether Crimson Theme Overrides when toggled in Settings */
    .theme-nether {
      --bg-screen: #1E1216;
      --bg-card: #2B1920;
      --bg-input: #140B0E;
      --pixel-green: #E04856;
      --pixel-green-btn: #B82534;
      --pixel-green-hi: #F46270;
      --pixel-green-lo: #78131E;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-studio);
      font-family: 'VT323', monospace;
      color: #f4f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .font-pixel {
      font-family: 'Press Start 2P', monospace;
      letter-spacing: 0.04em;
    }

    .font-vt {
      font-family: 'VT323', monospace;
      letter-spacing: 0.02em;
    }

    /* ==========================================================================
       MOBILE DEVICE FRAME (380PX WIDTH, CENTERED ON #111116 STUDIO BACKDROP)
       ========================================================================== */
    .phone-frame {
      width: 380px;
      max-width: calc(100vw - 24px);
      height: 740px;
      max-height: calc(100vh - 108px);
      min-height: 610px;
      background-color: var(--bg-screen);
      border: 3px solid #0b0c10;
      box-shadow:
        inset 2px 2px 0px #2b2d3b,
        inset -2px -2px 0px #0e0f14,
        0 28px 60px -12px rgba(0, 0, 0, 0.82),
        0 0 0 1px #252734;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: background-color 0.25s ease;
    }

    /* Custom slim dark scrollbar inside phone viewport */
    .screen-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: #343746 transparent;
    }
    .screen-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .screen-scroll::-webkit-scrollbar-thumb {
      background-color: #343746;
    }

    /* ==========================================================================
       BEVELED 3D PIXEL BUTTONS, BADGES & INPUTS (SHARP 0PX RADIUS)
       ========================================================================== */
    .pixel-btn {
      border-radius: 0px;
      border: 2px solid #0b0c10;
      font-family: 'Press Start 2P', monospace;
      color: #ffffff;
      text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.68);
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.06s ease, filter 0.12s ease;
      position: relative;
    }

    .pixel-btn:hover {
      filter: brightness(1.07);
    }

    .pixel-btn:active {
      transform: translateY(2px);
    }

    /* Primary Green Beveled Button (#4E9A2D) */
    .pixel-btn-green {
      background-color: var(--pixel-green-btn);
      box-shadow:
        inset 2px 2px 0px var(--pixel-green-hi),
        inset -2px -2px 0px var(--pixel-green-lo),
        0 3px 0px #0b0c10;
    }
    .pixel-btn-green:active {
      box-shadow:
        inset 2px 2px 0px var(--pixel-green-lo),
        inset -2px -2px 0px var(--pixel-green-hi);
    }

    /* Secondary Gray Beveled Button (#6E717C) */
    .pixel-btn-gray {
      background-color: var(--pixel-gray-btn);
      box-shadow:
        inset 2px 2px 0px var(--pixel-gray-hi),
        inset -2px -2px 0px var(--pixel-gray-lo),
        0 3px 0px #0b0c10;
    }
    .pixel-btn-gray:active {
      box-shadow:
        inset 2px 2px 0px var(--pixel-gray-lo),
        inset -2px -2px 0px var(--pixel-gray-hi);
    }

    /* Yellow Accent Beveled Button (#F2C438) */
    .pixel-btn-yellow {
      background-color: var(--pixel-yellow);
      color: #15161c;
      text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.45);
      box-shadow:
        inset 2px 2px 0px var(--pixel-yellow-hi),
        inset -2px -2px 0px var(--pixel-yellow-lo),
        0 3px 0px #0b0c10;
    }
    .pixel-btn-yellow:active {
      box-shadow:
        inset 2px 2px 0px var(--pixel-yellow-lo),
        inset -2px -2px 0px var(--pixel-yellow-hi);
    }

    /* Red Danger Beveled Button */
    .pixel-btn-red {
      background-color: var(--pixel-red-btn);
      box-shadow:
        inset 2px 2px 0px var(--pixel-red-hi),
        inset -2px -2px 0px var(--pixel-red-lo),
        0 3px 0px #0b0c10;
    }
    .pixel-btn-red:active {
      box-shadow:
        inset 2px 2px 0px var(--pixel-red-lo),
        inset -2px -2px 0px var(--pixel-red-hi);
    }

    /* Recessed Dark Pixel Input */
    .pixel-input {
      width: 100%;
      background-color: var(--bg-input);
      border: 2px solid #0b0c10;
      box-shadow:
        inset 2px 2px 0px #060709,
        inset -2px -2px 0px #2b2e3b;
      color: #eceef5;
      font-family: 'VT323', monospace;
      font-size: 20px;
      letter-spacing: 0.03em;
      padding: 8px 12px;
      outline: none;
      border-radius: 0px;
      transition: box-shadow 0.15s ease;
    }

    .pixel-input::placeholder {
      color: #65697a;
    }

    .pixel-input:focus {
      box-shadow:
        inset 2px 2px 0px #060709,
        inset -2px -2px 0px var(--pixel-green);
    }

    /* Dark Pixel Card Container */
    .pixel-card {
      background-color: var(--bg-card);
      border: 2px solid #0b0c10;
      box-shadow:
        inset 1px 1px 0px #313445,
        0 3px 0px #0b0c10;
      border-radius: 0px;
    }

    /* Beveled Square Icon Blocks */
    .pixel-block-green {
      background-color: #4b8b2b;
      border: 2px solid #0b0c10;
      box-shadow:
        inset 2px 2px 0px #6ec244,
        inset -2px -2px 0px #2f5c19;
    }

    .pixel-block-blue {
      background-color: #2b6cb0;
      border: 2px solid #0b0c10;
      box-shadow:
        inset 2px 2px 0px #4c94e0,
        inset -2px -2px 0px #1a4370;
    }

    .pixel-block-purple {
      background-color: #7b3fa0;
      border: 2px solid #0b0c10;
      box-shadow:
        inset 2px 2px 0px #a35ed0,
        inset -2px -2px 0px #4d2466;
    }

    .pixel-block-red {
      background-color: #c93b2b;
      border: 2px solid #0b0c10;
      box-shadow:
        inset 2px 2px 0px #e85c4c,
        inset -2px -2px 0px #872116;
    }

    .pixel-block-orange {
      background-color: #d97724;
      border: 2px solid #0b0c10;
      box-shadow:
        inset 2px 2px 0px #f59b4c,
        inset -2px -2px 0px #944b0e;
    }

    /* Quiz Answer Option Beveled Row */
    .quiz-option {
      width: 100%;
      background-color: #292b38;
      border: 2px solid #0b0c10;
      box-shadow:
        inset 2px 2px 0px #3c3f52,
        inset -2px -2px 0px #181921,
        0 3px 0px #0b0c10;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.06s ease, background-color 0.12s ease;
    }

    .quiz-option:hover {
      background-color: #323545;
    }

    .quiz-option:active {
      transform: translateY(2px);
    }

    .quiz-option.selected-correct {
      background-color: #3f7823;
      box-shadow:
        inset 2px 2px 0px #5ea838,
        inset -2px -2px 0px #264a14,
        0 3px 0px #0b0c10;
    }

    .quiz-option.selected-wrong {
      background-color: #8f291e;
      box-shadow:
        inset 2px 2px 0px #c44133,
        inset -2px -2px 0px #57160f,
        0 3px 0px #0b0c10;
    }

    /* Smooth Screen Fade/Slide Entrance */
    @keyframes pixelScreenEnter {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .screen-animate {
      animation: pixelScreenEnter 0.18s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* ==========================================================================
       TREASURE CHEST LOGO & SPARKLE ANIMATIONS
       ========================================================================== */
    @keyframes chestGentleFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-3px);
      }
    }

    .chest-idle {
      animation: chestGentleFloat 2.8s ease-in-out infinite;
    }

    @keyframes chestHopAction {
      0% {
        transform: translateY(0px) scale(1, 1);
      }
      22% {
        transform: translateY(3px) scale(1.07, 0.92);
      }
      52% {
        transform: translateY(-13px) scale(0.95, 1.06);
      }
      78% {
        transform: translateY(-2px) scale(1.02, 0.98);
      }
      100% {
        transform: translateY(0px) scale(1, 1);
      }
    }

    .chest-hop {
      transform-origin: bottom center;
      animation: chestHopAction 0.48s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes sparkleTwinkle {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.35;
        transform: scale(0.72);
      }
    }

    .sparkle-a {
      transform-box: fill-box;
      transform-origin: center;
      animation: sparkleTwinkle 1.7s steps(2) infinite;
    }

    .sparkle-b {
      transform-box: fill-box;
      transform-origin: center;
      animation: sparkleTwinkle 2.1s steps(2) 0.6s infinite;
    }

    .sparkle-c {
      transform-box: fill-box;
      transform-origin: center;
      animation: sparkleTwinkle 1.5s steps(2) 1.1s infinite;
    }

    /* Stacked Pixel Title Typography Styling matching reference artwork */
    .logo-word-trivia {
      font-family: 'Press Start 2P', monospace;
      color: #F2C438;
      text-shadow:
        -2px -2px 0 #0b0c10,
         2px -2px 0 #0b0c10,
        -2px  2px 0 #0b0c10,
         2px  2px 0 #0b0c10,
         0px  4px 0 #0b0c10;
    }

    .logo-word-craft {
      font-family: 'Press Start 2P', monospace;
      color: #62A83B;
      text-shadow:
        -2px -2px 0 #0b0c10,
         2px -2px 0 #0b0c10,
        -2px  2px 0 #0b0c10,
         2px  2px 0 #0b0c10,
         0px  4px 0 #0b0c10;
    }

    /* ==========================================================================
       ADORABLE PIXEL-ART 'CUTIE OBJECTS' ANIMATIONS
       ========================================================================== */
    .cute-disabled .cutie-actor,
    .cute-disabled #ambientParticlesLayer {
      display: none !important;
    }

    .cute-disabled .chest-idle,
    .cute-disabled .sparkle-a,
    .cute-disabled .sparkle-b,
    .cute-disabled .sparkle-c {
      animation: none !important;
    }

    /* Pip the Slime: Squash-and-stretch bouncy hop along grass & cards */
    @keyframes slimeSquashHop {
      0%, 100% {
        transform: translateY(0px) scaleX(1.06) scaleY(0.92);
      }
      18% {
        transform: translateY(1px) scaleX(1.16) scaleY(0.82);
      }
      45% {
        transform: translateY(-12px) scaleX(0.88) scaleY(1.14);
      }
      72% {
        transform: translateY(-3px) scaleX(0.96) scaleY(1.04);
      }
      86% {
        transform: translateY(1px) scaleX(1.12) scaleY(0.88);
      }
    }

    .slime-hop {
      transform-origin: bottom center;
      animation: slimeSquashHop 1.75s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }

    @keyframes pixelEyeBlink {
      0%, 90%, 100% {
        transform: scaleY(1);
      }
      94%, 97% {
        transform: scaleY(0.12);
      }
    }

    .slime-eyes {
      transform-origin: center 9px;
      animation: pixelEyeBlink 3.6s infinite;
    }

    /* Pip Quiz Reactions: Cheer, Nervous, Wobble */
    @keyframes slimeCheerJump {
      0%, 100% {
        transform: translateY(0) scaleX(1.1) scaleY(0.9);
      }
      40% {
        transform: translateY(-16px) scaleX(0.86) scaleY(1.18) rotate(-4deg);
      }
      75% {
        transform: translateY(-5px) scaleX(0.95) scaleY(1.05) rotate(4deg);
      }
    }

    .slime-cheer {
      transform-origin: bottom center;
      animation: slimeCheerJump 0.65s ease-in-out infinite;
    }

    @keyframes slimeNervousShake {
      0%, 100% {
        transform: translateX(0px) scaleX(1.04) scaleY(0.95);
      }
      25% {
        transform: translateX(-2px) scaleX(0.98) scaleY(1.02);
      }
      75% {
        transform: translateX(2px) scaleX(0.98) scaleY(1.02);
      }
    }

    .slime-nervous {
      transform-origin: bottom center;
      animation: slimeNervousShake 0.24s linear infinite;
    }

    @keyframes slimeDizzyWobble {
      0%, 100% {
        transform: rotate(0deg) scaleX(1.08) scaleY(0.92);
      }
      25% {
        transform: rotate(-10deg) translateX(-3px);
      }
      75% {
        transform: rotate(10deg) translateX(3px);
      }
    }

    .slime-wobble {
      transform-origin: bottom center;
      animation: slimeDizzyWobble 0.45s ease-in-out infinite;
    }

    @keyframes sweatDropFall {
      0% {
        opacity: 0;
        transform: translateY(-2px);
      }
      30% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    .sweat-drop {
      animation: sweatDropFall 0.9s linear infinite;
    }

    /* Buzzy the Pixel Bumblebee: Figure-eight loop + fast flapping wings */
    @keyframes beeFigureEight {
      0% {
        transform: translate(0px, 0px) scaleX(1);
      }
      12% {
        transform: translate(15px, -5px) scaleX(1);
      }
      25% {
        transform: translate(26px, 0px) scaleX(1);
      }
      38% {
        transform: translate(15px, 5px) scaleX(-1);
      }
      50% {
        transform: translate(0px, 0px) scaleX(-1);
      }
      62% {
        transform: translate(-15px, -5px) scaleX(-1);
      }
      75% {
        transform: translate(-26px, 0px) scaleX(-1);
      }
      88% {
        transform: translate(-15px, 5px) scaleX(1);
      }
      100% {
        transform: translate(0px, 0px) scaleX(1);
      }
    }

    .bee-patrol {
      animation: beeFigureEight 5.2s ease-in-out infinite;
    }

    @keyframes beeWingFlap {
      0%, 100% {
        transform: scaleY(1) translateY(0px);
      }
      50% {
        transform: scaleY(0.35) translateY(2px);
      }
    }

    .bee-wings {
      transform-origin: center 5px;
      animation: beeWingFlap 0.14s steps(2) infinite;
    }

    /* Peep the Pixel Baby Chick: Cheerful waddle & hop */
    @keyframes chickWaddleHop {
      0%, 100% {
        transform: translateY(0px) rotate(-4deg);
      }
      25% {
        transform: translateY(-4px) rotate(0deg);
      }
      50% {
        transform: translateY(0px) rotate(4deg);
      }
      75% {
        transform: translateY(-4px) rotate(0deg);
      }
    }

    .chick-waddle {
      transform-origin: bottom center;
      animation: chickWaddleHop 0.85s steps(2) infinite;
    }

    /* Ambient Upward-Drifting Collectibles (Coins, Hearts, Stars, Sparkles) */
    @keyframes ambientFloatUp {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.8);
      }
      15% {
        opacity: 0.72;
      }
      80% {
        opacity: 0.65;
      }
      100% {
        opacity: 0;
        transform: translateY(-185px) scale(1.05);
      }
    }

    .ambient-collectible {
      position: absolute;
      pointer-events: none;
      animation: ambientFloatUp linear forwards;
    }

    /* Interactive Tap/Click Burst Particle */
    @keyframes burstFlyOut {
      0% {
        opacity: 1;
        transform: translate(0px, 0px) scale(0.8);
      }
      65% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(1.18);
      }
    }

    .burst-particle {
      position: absolute;
      pointer-events: none;
      z-index: 60;
      animation: burstFlyOut 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body>

  <!-- ========================================================================
       OUTER STUDIO HEADER CAPTION (DYNAMIC SCREEN TITLE)
       ======================================================================== -->
  <header class="w-full max-w-[380px] px-1 mb-2 flex items-center justify-between text-sm text-gray-400">
    <span id="studioCaption" class="font-vt text-lg tracking-wide text-gray-300">
      TriviaCraft &middot; Start
    </span>
    <button
      id="resetStartBtn"
      onclick="navigateTo('start')"
      class="font-vt text-base text-gray-400 hover:text-[#F2C438] underline decoration-dotted cursor-pointer transition-colors"
      title="Reset prototype to Start screen"
    >
      Reset to Start
    </button>
  </header>

  <!-- ========================================================================
       MOBILE DEVICE FRAME (380PX WIDTH, #1A1B24 SCREEN SURFACE)
       ======================================================================== -->
  <main id="phoneFrame" class="phone-frame" aria-label="TriviaCraft Mobile App Prototype">

    <!-- AMBIENT FLOATING CUTIE COLLECTIBLES LAYER -->
    <div id="ambientParticlesLayer" class="pointer-events-none absolute inset-0 z-10 overflow-hidden"></div>

    <!-- INTERACTIVE TAP/CLICK BURST PARTICLES LAYER -->
    <div id="burstParticlesLayer" class="pointer-events-none absolute inset-0 z-50 overflow-hidden"></div>

    <!-- 36px TOP PIXEL GRASS-AND-DIRT BANNER + CUTIE MASCOTS -->
    <div class="relative w-full h-[36px] shrink-0 select-none border-b-2 border-[#0b0c10] z-20">
      <div id="topGrassBanner" class="w-full h-full"></div>

      <!-- Hopping Pixel Slime Pet ('Pip') perched along the top grass banner -->
      <button
        id="bannerPipBtn"
        type="button"
        onclick="petMascot(event, 'Pip')"
        title="Tap Pip the Slime!"
        aria-label="Tap Pip the Slime"
        class="cutie-actor slime-hop absolute left-[30px] -bottom-[2px] z-30 cursor-pointer focus:outline-none p-0 bg-transparent border-0"
      >
        <div id="bannerPipSprite"></div>
      </button>

      <!-- Buzzing Pixel Bumblebee ('Buzzy') patrolling near the top-right grass edge -->
      <button
        id="bannerBuzzyBtn"
        type="button"
        onclick="petMascot(event, 'Buzzy')"
        title="Tap Buzzy the Bee!"
        aria-label="Tap Buzzy the Bee"
        class="cutie-actor bee-patrol absolute right-[52px] top-[2px] z-30 cursor-pointer focus:outline-none p-0 bg-transparent border-0"
      >
        <div id="bannerBuzzySprite"></div>
      </button>
    </div>

    <!-- DYNAMIC SCREEN CONTENT CONTAINER -->
    <div id="screenContainer" class="screen-scroll flex flex-col relative z-20">
      <!-- Active screen HTML is injected cleanly here -->
    </div>

    <!-- IN-PHONE PIXEL TOAST NOTIFICATION (REPLACES ALERT/CONFIRM) -->
    <div
      id="pixelToast"
      class="pointer-events-none opacity-0 transition-opacity duration-150 absolute bottom-4 left-4 right-4 z-50 bg-[#101118] border-2 border-[#F2C438] px-3 py-2 shadow-lg flex items-center justify-between"
    >
      <span id="pixelToastText" class="font-vt text-lg leading-none text-[#F2C438]"></span>
      <span class="font-pixel text-[8px] text-[#62A83B]">OK</span>
    </div>

    <!-- IN-PHONE DELETE CONFIRMATION BAR (NO BROWSER POPUPS) -->
    <div
      id="deleteConfirmModal"
      class="hidden absolute inset-0 z-40 bg-black/75 flex items-center justify-center p-5"
    >
      <div class="pixel-card w-full p-4 bg-[#1d1f2a] border-2 border-[#0b0c10]">
        <h3 class="font-pixel text-[10px] text-[#e85c4c] mb-2">DELETE DECK?</h3>
        <p id="deleteConfirmMessage" class="font-vt text-xl text-gray-200 leading-tight mb-4">
          Remove this deck from your chest?
        </p>
        <div class="flex gap-2">
          <button
            onclick="confirmDeleteDeck()"
            class="pixel-btn pixel-btn-red flex-1 py-2.5 text-[9px]"
          >
            DELETE
          </button>
          <button
            onclick="closeDeleteConfirm()"
            class="pixel-btn pixel-btn-gray flex-1 py-2.5 text-[9px]"
          >
            CANCEL
          </button>
        </div>
      </div>
    </div>

    <!-- IN-PHONE CREATE/EDIT DECK MODAL (NO BROWSER POPUPS) -->
    <div
      id="deckModal"
      class="hidden absolute inset-0 z-40 bg-black/75 flex items-center justify-center p-5"
    >

    /**
     * Web Audio API Retro 8-Bit Sound Synthesizer
     * Includes custom 'treasure' coin chime, 'start', 'success', 'cute', 'wrong', & 'click'
     */
    let audioCtx = null;
    function playPixelSound(type = 'click') {
      if (!appState.settings.soundEffects) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';

        const now = audioCtx.currentTime;
        if (type === 'treasure') {
          // Classic 8-bit coin/chest chime (B5 -> E6 -> G6)
          osc.frequency.setValueAtTime(987.77, now);
          osc.frequency.setValueAtTime(1318.51, now + 0.065);
          osc.frequency.setValueAtTime(1567.98, now + 0.13);
          gain.gain.setValueAtTime(0.065, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === 'start') {
          osc.frequency.setValueAtTime(330, now);
          osc.frequency.setValueAtTime(440, now + 0.06);
          osc.frequency.setValueAtTime(660, now + 0.12);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'success') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(783.99, now + 0.07);
          osc.frequency.setValueAtTime(1046.5, now + 0.14);
          gain.gain.setValueAtTime(0.055, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.24);
        } else if (type === 'cute') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.05);
          osc.frequency.setValueAtTime(1174.66, now + 0.1);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'wrong') {
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.setValueAtTime(175, now + 0.08);
          gain.gain.setValueAtTime(0.055, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.18);
        } else {
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.setValueAtTime(280, now + 0.04);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (err) {
        // Ignore audio errors if blocked by browser autoplay policy
      }
    }

    /**
     * Interactive Burst Particles & Mascot Petting Handler
     */
    function spawnBurstAtElement(el, count = 8, kinds = ['heart', 'star', 'coin']) {
      if (!appState.settings.cuteAnimations) return;
      const frame = document.getElementById('phoneFrame');
      const layer = document.getElementById('burstParticlesLayer');
      if (!frame || !layer || !el) return;

      const frameRect = frame.getBoundingClientRect();
      const elRect = el.getBoundingClientRect();
      const originX = elRect.left - frameRect.left + elRect.width / 2;
      const originY = elRect.top - frameRect.top + elRect.height / 2;

      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'burst-particle';
        const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.45 - 0.22);
        const dist = 28 + Math.random() * 38;
        const tx = Math.round(Math.cos(angle) * dist) + 'px';
        const ty = Math.round(Math.sin(angle) * dist - 20) + 'px';
        p.style.setProperty('--tx', tx);
        p.style.setProperty('--ty', ty);
        p.style.left = `${Math.round(originX - 7)}px`;
        p.style.top = `${Math.round(originY - 7)}px`;

        const kind = kinds[i % kinds.length];
        p.innerHTML = getMiniCollectibleSVG(kind, 13);
        layer.appendChild(p);
        setTimeout(() => p.remove(), 760);
      }
    }

    function petMascot(event, mascotName) {
      if (event) event.stopPropagation();
      playPixelSound('cute');
      if (event && event.currentTarget) {
        spawnBurstAtElement(event.currentTarget, 8, ['heart', 'star', 'coin']);
      }
      const messages = {
        Pip: 'Pip the Slime loves trivia! +1 Love',
        Buzzy: 'Buzzy dropped golden star dust!',
        Peep: 'Peep chirps: Ready to craft!'
      };
      showPixelToast(messages[mascotName] || 'Cute pixel boost!');
    }

    /**
     * Ambient Background Collectibles Loop
     */
    let ambientTimer = null;
    function startAmbientCollectiblesLoop() {
      if (ambientTimer) clearInterval(ambientTimer);
      ambientTimer = setInterval(() => {
        if (!appState.settings.cuteAnimations) return;
        const layer = document.getElementById('ambientParticlesLayer');
        if (!layer || layer.childElementCount > 7) return;

        const kinds = ['coin', 'heart', 'star', 'sparkle'];
        const kind = kinds[Math.floor(Math.random() * kinds.length)];
        const item = document.createElement('div');
        item.className = 'ambient-collectible';
        const leftPct = 8 + Math.floor(Math.random() * 84);
        const topPct = 36 + Math.floor(Math.random() * 54);
        const dur = (4.4 + Math.random() * 2.2).toFixed(1);

        item.style.left = `${leftPct}%`;
        item.style.top = `${topPct}%`;
        item.style.animationDuration = `${dur}s`;
        item.innerHTML = getMiniCollectibleSVG(kind, 11);

        layer.appendChild(item);
        setTimeout(() => item.remove(), parseFloat(dur) * 1000 + 100);
      }, 1450);
    }

      appState.currentScreen = screenName;

    let toastTimeout = null;
    function showPixelToast(message) {
      const toast = document.getElementById('pixelToast');
      const text = document.getElementById('pixelToastText');
      text.textContent = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2100);
    }

    function openCreateDeckModal() {
      playPixelSound('click');

      document.getElementById('deckNameInput').value = '';
      document.getElementById('deckCategoryInput').value = '';
      document.getElementById('deckModal').classList.remove('hidden');
    }

    function openEditDeckModal(deckId) {
      playPixelSound('click');
      const deck = appState.decks.find((d) => d.id === deckId);
      if (!deck) return;
      appState.editingDeckId = deckId;
      document.getElementById('deckModalTitle').textContent = 'EDIT DECK';
      document.getElementById('deckNameInput').value = deck.title;
      document.getElementById('deckCategoryInput').value = deck.category;
      document.getElementById('deckModal').classList.remove('hidden');
    }

    function closeDeckModal() {
      playPixelSound('click');
      document.getElementById('deckModal').classList.add('hidden');
    }

    function saveDeckFromModal() {
      const nameVal = document.getElementById('deckNameInput').value.trim();
      const catVal = document.getElementById('deckCategoryInput').value.trim() || 'General';
      if (!nameVal) {
        showPixelToast('Enter a deck name first!');
        return;
      }

      if (appState.editingDeckId) {
        const deck = appState.decks.find((d) => d.id === appState.editingDeckId);
        if (deck) {
          deck.title = nameVal;
          deck.category = catVal;
          deck.letter = nameVal.charAt(0).toUpperCase();
        }
        showPixelToast('Deck updated!');
      } else {
        const badgeOptions = ['pixel-block-green', 'pixel-block-blue', 'pixel-block-purple', 'pixel-block-orange'];
        const badgeClass = badgeOptions[appState.decks.length % badgeOptions.length];
        appState.decks.push({
          id: 'deck-' + Date.now(),
          letter: nameVal.charAt(0).toUpperCase(),
          badgeClass,
          title: nameVal,
          category: catVal,
          count: 5,
          bestScore: 0
        });
        showPixelToast('New deck crafted!');
      }

      playPixelSound('success');
      document.getElementById('deckModal').classList.add('hidden');
      renderCurrentScreen();
    }

    function promptDeleteDeck(deckId) {
      playPixelSound('click');
      const deck = appState.decks.find((d) => d.id === deckId);
      if (!deck) return;
      appState.pendingDeleteId = deckId;
      document.getElementById('deleteConfirmMessage').textContent = `Delete "${deck.title}" from My Decks?`;
      document.getElementById('deleteConfirmModal').classList.remove('hidden');
    }

    function closeDeleteConfirm() {
      playPixelSound('click');
      appState.pendingDeleteId = null;
      document.getElementById('deleteConfirmModal').classList.add('hidden');
    }

      if (appState.pendingDeleteId) {
        appState.decks = appState.decks.filter((d) => d.id !== appState.pendingDeleteId);
        appState.pendingDeleteId = null;
        playPixelSound('wrong');
        showPixelToast('Deck deleted.');
      }
      document.getElementById('deleteConfirmModal').classList.add('hidden');
      renderCurrentScreen();
    }

    /**
     * ==========================================================================
     * SCREEN 5: QUIZ SCREEN ('TriviaCraft · Quiz')
     * - Opens upon clicking 'PLAY' on any deck
     * - 'QUESTION X/Y' and 'SCORE' header
     * - 10-block green pixel 'TIME LEFT' countdown bar
     * - Question display box + beveled A/B/C/D answer buttons
     * - Pip the Slime reacting dynamically (cheering, sweating, wobbling)
     * - Completion summary screen
     * ==========================================================================
     */
    function startDeckQuiz(deckId) {
      const deck = appState.decks.find((d) => d.id === deckId) || appState.decks[0];
      const bank = questionBanks[deck.id] || questionBanks.android;

      appState.quiz.activeDeckId = deck.id;
      appState.quiz.activeDeckTitle = deck.title;
      appState.quiz.activeQuestions = bank;
      appState.quiz.totalQuestions = bank.length;
      appState.quiz.questionIndex = 0;
      appState.quiz.score = 0;
      appState.quiz.timeLeftBlocks = 10;
      appState.quiz.selectedOption = null;
      appState.quiz.lastAnswerCorrect = null;

      playPixelSound('start');
      navigateTo('quiz');
    }

    function startQuizTimer() {
      if (appState.quiz.timerInterval) clearInterval(appState.quiz.timerInterval);

      // Ensure activeQuestions is populated if user jumped via step bar
      if (!appState.quiz.activeQuestions.length) {
        appState.quiz.activeQuestions = questionBanks.android;
        appState.quiz.totalQuestions = questionBanks.android.length;
      }

      const stepMs = Math.max(450, Math.round((appState.settings.questionTimer * 1000) / 10));
      appState.quiz.timerInterval = setInterval(() => {
        if (appState.currentScreen !== 'quiz') {
          clearInterval(appState.quiz.timerInterval);
          return;
        }
        if (appState.quiz.selectedOption !== null) return;

        if (appState.quiz.timeLeftBlocks > 0) {
          appState.quiz.timeLeftBlocks -= 1;
          renderCurrentScreen();
        } else {
          // Time ran out on current question
          handleQuizAnswer(null);
        }
      }, stepMs);
    }

    function handleQuizAnswer(optionKey) {
      if (appState.quiz.selectedOption !== null) return;
      const q = appState.quiz.activeQuestions[appState.quiz.questionIndex];
      if (!q) return;

      appState.quiz.selectedOption = optionKey || 'TIMEOUT';
      const isCorrect = optionKey === q.correct;
      appState.quiz.lastAnswerCorrect = isCorrect;

      if (isCorrect) {
        appState.quiz.score += 20;
        playPixelSound('success');
        const container = document.getElementById('screenContainer');
        spawnBurstAtElement(container, 9, ['coin', 'heart', 'star']);
      } else {
        playPixelSound('wrong');
      }

      renderCurrentScreen();

      setTimeout(() => {
        if (appState.currentScreen !== 'quiz') return;
        appState.quiz.questionIndex += 1;
        appState.quiz.selectedOption = null;
        appState.quiz.lastAnswerCorrect = null;
        appState.quiz.timeLeftBlocks = 10;

        if (appState.quiz.questionIndex >= appState.quiz.totalQuestions) {
          if (appState.quiz.timerInterval) clearInterval(appState.quiz.timerInterval);
          // Save best score on deck
          const deck = appState.decks.find((d) => d.id === appState.quiz.activeDeckId);
          if (deck && appState.quiz.score > deck.bestScore) {
            deck.bestScore = appState.quiz.score;
          }
        }
        renderCurrentScreen();
      }, 1050);
    }

    function renderQuizScreen() {
      if (!appState.quiz.activeQuestions.length) {
        appState.quiz.activeQuestions = questionBanks.android;
        appState.quiz.totalQuestions = questionBanks.android.length;
      }

      // Completion Summary Screen
      if (appState.quiz.questionIndex >= appState.quiz.totalQuestions) {
        return `
          <div class="screen-animate flex-1 flex flex-col items-center justify-between px-5 py-6 text-center">
            <div class="w-full flex items-center justify-between">
              <span class="font-pixel text-[8px] text-[#9A9EAE]">${appState.quiz.activeDeckTitle.toUpperCase()}</span>
              <span class="font-pixel text-[8px] text-[#62A83B]">COMPLETE</span>
            </div>

            <div class="my-auto flex flex-col items-center">
              <div class="cutie-actor slime-cheer mb-3">
                ${getPipSlimeSVG('cheer', 48)}
              </div>
              ${getTreasureChestLogoSVG(126, 100)}
              <h2 class="font-pixel text-[14px] text-[#F2C438] mt-3">QUEST CLEARED!</h2>
              <p class="font-vt text-2xl text-white mt-1">
                FINAL SCORE: <span class="text-[#62A83B]">${appState.quiz.score}</span> / ${appState.quiz.totalQuestions * 20}
              </p>
              <p class="font-vt text-lg text-[#9A9EAE] mt-1">
                Pip the Slime celebrates your trivia loot!
              </p>
            </div>

            <div class="w-full space-y-2.5">
              <button
                type="button"
                onclick="startDeckQuiz('${appState.quiz.activeDeckId}')"
                class="pixel-btn pixel-btn-green w-full py-3.5 text-[10px]"
              >
                PLAY AGAIN
              </button>
              <button
                type="button"
                onclick="playPixelSound('click'); navigateTo('decks')"
                class="pixel-btn pixel-btn-gray w-full py-3 text-[9px]"
              >
                BACK TO MY DECKS
              </button>
            </div>
          </div>
        `;
      }

      const q = appState.quiz.activeQuestions[appState.quiz.questionIndex];
      const qNum = appState.quiz.questionIndex + 1;
      const totalQ = appState.quiz.totalQuestions;

      // Determine Pip the Slime's live reaction mood & animation
      let pipMood = 'happy';
      let pipAnim = 'slime-hop';
      let pipCaption = 'Pip is cheering you on!';
      if (appState.quiz.selectedOption !== null) {
        if (appState.quiz.lastAnswerCorrect) {
          pipMood = 'cheer';
          pipAnim = 'slime-cheer';
          pipCaption = 'AWESOME! +20 POINTS!';
        } else {
          pipMood = 'dizzy';
          pipAnim = 'slime-wobble';
          pipCaption = appState.quiz.selectedOption === 'TIMEOUT' ? 'OUT OF TIME!' : 'OOPS! KEEP GOING!';
        }
      } else if (appState.quiz.timeLeftBlocks <= 3) {
        pipMood = 'nervous';
        pipAnim = 'slime-nervous';
        pipCaption = 'HURRY! CLOCK LOW!';
      }

      // 10-block pixel countdown bar
      let timerBlocksHTML = '';
      for (let i = 0; i < 10; i++) {
        const filled = i < appState.quiz.timeLeftBlocks;
        const lowColor = appState.quiz.timeLeftBlocks <= 3 ? 'bg-[#e85c4c]' : 'bg-[#62A83B]';
        timerBlocksHTML += `
          <div class="h-4 flex-1 border border-[#0b0c10] ${filled ? lowColor : 'bg-[#121319]'}"></div>
        `;
      }

      const optionsHTML = q.options
        .map((opt) => {
          let stateClass = '';
          if (appState.quiz.selectedOption !== null) {
            if (opt.key === q.correct) {
              stateClass = 'selected-correct';
            } else if (opt.key === appState.quiz.selectedOption) {
              stateClass = 'selected-wrong';
            }
          }

          return `
            <button
              type="button"
              onclick="handleQuizAnswer('${opt.key}')"
              class="quiz-option ${stateClass}"
            >
              <span class="${opt.color} w-7 h-7 shrink-0 flex items-center justify-center font-pixel text-[10px] text-white">
                ${opt.key}
              </span>
              <span class="font-vt text-[21px] leading-none text-white">
                ${opt.label}
              </span>
            </button>
          `;
        })
        .join('');

      return `
        <div class="screen-animate flex-1 flex flex-col justify-between px-4 pt-3.5 pb-4">
          <div>
            <!-- Top Question & Score Header -->
            <div class="flex items-center justify-between mb-2.5">
              <span class="font-pixel text-[9px] text-[#F2C438]">
                QUESTION ${qNum}/${totalQ}
              </span>
              <span class="font-pixel text-[9px] text-[#F2C438]">
                SCORE ${appState.quiz.score}
              </span>
            </div>

            <!-- 10-Block Time Left Countdown Bar -->
            <div class="mb-3">
              <div class="flex items-center justify-between mb-1">
                <span class="font-pixel text-[7px] text-[#d0d3de]">TIME LEFT</span>
                <button
                  type="button"
                  onclick="playPixelSound('click'); navigateTo('decks')"
                  class="font-pixel text-[7px] text-[#9A9EAE] hover:text-white cursor-pointer bg-transparent border-0 p-0"
                >
                  QUIT &times;
                </button>
              </div>
              <div class="flex gap-1">${timerBlocksHTML}</div>
            </div>

            <!-- Question Display Box with Gold Top Accent -->
            <div class="pixel-card border-t-[3px] border-t-[#F2C438] p-3.5 mb-3">
              <p class="font-vt text-[23px] leading-snug text-white">
                ${q.text}
              </p>
            </div>

            <!-- Beveled A / B / C / D Answer Buttons -->
            <div class="space-y-2">
              ${optionsHTML}
            </div>
          </div>

          <!-- Bottom Live Mascot Reaction Footer -->
          <div class="flex items-center justify-between pt-2.5 mt-2 border-t border-[#282a38]">
            <div class="flex items-center gap-2.5">
              <div class="cutie-actor ${pipAnim}">
                ${getPipSlimeSVG(pipMood, 26)}
              </div>
              <span class="font-pixel text-[7px] ${
                appState.quiz.selectedOption !== null
                  ? appState.quiz.lastAnswerCorrect
                    ? 'text-[#62A83B]'
                    : 'text-[#e85c4c]'
                  : 'text-[#62A83B]'
              }">
                ${pipCaption}
              </span>
            </div>
            <span class="font-vt text-base text-[#6E7282]">${appState.quiz.activeDeckTitle}</span>
          </div>
        </div>
      `;
    }

    /**
     * Master Screen Renderer
     */
    function renderCurrentScreen() {
      const container = document.getElementById('screenContainer');
      if (!container) return;

      switch (appState.currentScreen) {
        case 'start':
          container.innerHTML = renderStartScreen();
          break;
        case 'settings':
          container.innerHTML = renderSettingsScreen();
          break;
        case 'login':
          container.innerHTML = renderLoginScreen();
          break;
        case 'decks':
          container.innerHTML = renderDecksScreen();
          break;
        case 'quiz':
          container.innerHTML = renderQuizScreen();
          break;
        default:
          container.innerHTML = renderStartScreen();
      }
    }

    /**
     * Bootstrap Prototype on Window Load
     */
    window.addEventListener('DOMContentLoaded', () => {
      renderTopBannerSVG();
      updateStudioChrome();
      renderCurrentScreen();
      startAmbientCollectiblesLoop();
    });
  </script>
</body>
</html>
